name: Backend health check
# Periodic health check; do not keep shared Render free instances awake all month.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://gifwave-backend.onrender.com/health || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Backend health check failed" >&2
          exit 1
